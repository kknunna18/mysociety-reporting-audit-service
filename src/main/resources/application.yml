server:
  port: 8087
  servlet:
    context-path: /api/v1
spring:
  application:
    name: mysociety-reporting-audit-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: mysociety
    open-in-view: false
  cloud:
    function:
      definition: reportingEventConsumer
    stream:
      bindings:
        reportingEventConsumer-in-0:
          destination: mysociety.events
          group: reporting-audit-service
          consumer:
            auto-startup: ${EVENT_CONSUMER_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    path: /swagger-ui.html
mysociety:
  security:
    issuer: mysociety-identity
    hs256-secret: ${JWT_HS256_SECRET}
